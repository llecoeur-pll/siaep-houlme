{{ define "main" }}
  <section class="page-header">
    <div class="container">
      <p class="eyebrow">SIAEP du Houlme</p>
      <h1>{{ .Title }}</h1>
    </div>
  </section>
  <section class="container page-section">
    {{ with .Content }}<div class="content">{{ . }}</div>{{ end }}
    <div class="card-grid">
      {{ range .Pages }}
        <a class="card" href="{{ .RelPermalink }}">
          <h2>{{ .Title }}</h2>
          <span class="card__link">Découvrir <span aria-hidden="true">→</span></span>
        </a>
      {{ end }}
    </div>
  </section>
{{ end }}
